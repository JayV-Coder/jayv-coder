  <path class="mast" d="M13 46.5v5M8.5 51.5h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
  <path class="housing" d="M3.2 14.5a9.8 9.8 0 0 1 19.6 0v28A4 4 0 0 1 18.8 46H7.2a4 4 0 0 1-4-3.5Z" />
  <g class="lenses">
