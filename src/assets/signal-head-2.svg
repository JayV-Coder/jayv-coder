    <circle class="lens lens--go" cx="13" cy="33" r="6.9" />
  </g>
  <g class="hoods" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <path d="M4.9 12.6a9.1 9.1 0 0 1 16.2 0" />
    <path d="M4.9 30.1a9.1 9.1 0 0 1 16.2 0" />
  </g>
  <g class="glints">
