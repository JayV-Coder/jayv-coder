[package]
name = "jayv"
version = "0.41.0"
description = "Local-first AI orchestration desktop and CLI"
authors = ["JayV Team"]
edition = "2024"
license = "MIT"

# O `_lib` evita que biblioteca e executável disputem o mesmo `jayv.pdb` no
# Windows.
[lib]
name = "jayv_lib"
path = "src/lib.rs"

[[bin]]
name = "jayv"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
dotenvy = "0.15"
globset = "0.4"
hex = "0.4"
jsonwebtoken = "9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
streaming-iterator = "0.1.9"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

# O seletor de pastas. No Windows e no macOS o rfd fala com o diálogo nativo do
# sistema, mas no Linux o backend padrão (gtk3) abre a janela pela própria thread
# GTK dele, que disputa o loop de eventos que o Tauri já roda — o diálogo nunca
# chega à tela. O portal XDG conversa por D-Bus com o seletor do ambiente, não
# toca em GTK e ainda funciona sob Wayland e dentro de Flatpak.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tauri-plugin-dialog = { version = "2.8.0", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd")))'.dependencies]
tauri-plugin-dialog = "2.8.0"

[dev-dependencies]
tempfile = "3"

# O binário de produção sai sem a tabela de símbolos e com o código otimizado
# de ponta a ponta: fica menor e bem mais difícil de ler num desmontador.
[profile.release]
strip = true
lto = true
codegen-units = 1
