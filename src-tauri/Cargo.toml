[package]
name = "jayv"
version = "0.56.0"
description = "Local-first AI orchestration desktop and CLI"
authors = ["JayV Team"]
edition = "2024"
license = "MIT"

# O `_lib` evita que biblioteca e executável disputem o mesmo `jayv.pdb` no
# Windows.
[lib]
name = "jayv_lib"
path = "src/lib.rs"

[[bin]]
name = "jayv"
path = "src/main.rs"

# O núcleo em camadas (`crates/`), de baixo para cima; a ordem completa está em
# `src/layers.rs`. Cada crate só depende das camadas abaixo dele, e o Cargo
# recusa ciclo entre crates.
[workspace]
members = ["crates/*"]
# `cargo test` sem `-p` roda os testes de todos os crates, não só os do app.
default-members = [".", "crates/*"]

[workspace.dependencies]
walkdir = "2"
thiserror = "2"
dirs = "7"
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
globset = "0.4"
hex = "0.4"
jsonwebtoken = "9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
similar = "2"
streaming-iterator = "0.1.9"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jayv-base = { path = "crates/jayv-base" }
jayv-store = { path = "crates/jayv-store" }
jayv-cloud = { path = "crates/jayv-cloud" }
jayv-agents = { path = "crates/jayv-agents" }
jayv-jev = { path = "crates/jayv-jev" }
jayv-plans = { path = "crates/jayv-plans" }
jayv-orgs = { path = "crates/jayv-orgs" }
jayv-code = { path = "crates/jayv-code" }
jayv-memory = { path = "crates/jayv-memory" }
jayv-workspace = { path = "crates/jayv-workspace" }
jayv-live = { path = "crates/jayv-live" }
jayv-orchestration = { path = "crates/jayv-orchestration" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
globset.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
similar.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
walkdir.workspace = true

# O seletor de pastas. No Windows e no macOS o rfd fala com o diálogo nativo do
# sistema, mas no Linux o backend padrão (gtk3) abre a janela pela própria thread
# GTK dele, que disputa o loop de eventos que o Tauri já roda — o diálogo nunca
# chega à tela. O portal XDG conversa por D-Bus com o seletor do ambiente, não
# toca em GTK e ainda funciona sob Wayland e dentro de Flatpak.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tauri-plugin-dialog = { version = "2.8.0", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd")))'.dependencies]
tauri-plugin-dialog = "2.8.0"

[dev-dependencies]
tempfile.workspace = true

# O binário de produção sai sem a tabela de símbolos e otimizado entre crates
# (LTO "thin"). O LTO completo com uma unidade de código só deixava o binário
# uns 20% menor, mas era feito numa thread só: compilar o `jayv` levava mais de
# 5 minutos no Windows do CI, e a versão nova demorava isso a mais para chegar
# a quem já tem o app.
[profile.release]
strip = true
lto = "thin"
