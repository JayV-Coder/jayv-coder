# Os agentes e modelos: as configurações de LLM, os provedores (HTTP e CLI),
# o roteador, as ferramentas e o uso e as cotas de cada agente.
# Só depende da base.
[package]
name = "jayv-agents"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jayv-base = { path = "../jayv-base" }
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
dirs.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync"] }
uuid.workspace = true
walkdir.workspace = true

# O grupo de processos do agente: parar um pedido derruba a árvore inteira.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
