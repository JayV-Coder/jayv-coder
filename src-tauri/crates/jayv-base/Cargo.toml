# A base do núcleo: textos para pessoas (i18n), configuração, o modelo de
# contexto, o cliente HTTP fechado, o firewall de contexto e o andamento do
# turno. Não conhece nenhuma outra camada.
[package]
name = "jayv-base"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dotenvy.workspace = true
globset.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
