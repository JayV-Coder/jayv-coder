# O armazenamento local: o SQLite global da máquina, a fila do que ainda não
# subiu para o Supabase, o cache de contexto e os checkpoints. Só depende da
# base.
[package]
name = "jayv-store"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
jayv-base = { path = "../jayv-base" }
anyhow.workspace = true
chrono.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
