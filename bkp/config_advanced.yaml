# Jev AI Orchestrator Configuration with Advanced Features

jev:
  default_strategy: auto
  optimization:
    minimize_tokens: true
    prefer_local: true
    allow_escalation: true

  # New adaptive routing settings
  adaptive_routing:
    enabled: true
    learning_rate: 0.1
    confidence_threshold: 0.7

  # Context management settings
  context:
    fork_limit: 8000
    cache_ttl: 3600
    privacy_filtering: true

  # Execution graph settings
  execution_graph:
    max_parallel_tasks: 4
    timeout_seconds: 300

providers:
  # Default OpenAI provider
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}

  # Default Anthropic provider
  anthropic:
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}

  # Example OpenAI-compatible provider (LM Studio)
  lmstudio:
    type: openai-compatible
    base_url: http://127.0.0.1:1234/v1

  # Example CLI provider (Claude CLI)
  claude-cli:
    type: cli
    command: claude
    auto_detect: true

models:
  # Local model fast responses
  local-fast:
    provider: lmstudio
    model: qwen
    capabilities:
      - chat
      - code
    cost_class: free
    speed: fast

  # Premium coding model
  coding-premium:
    provider: anthropic
    model: claude-3-opus
    capabilities:
      - code
      - reasoning
      - tools
    cost_class: high
    speed: slow

  # Reasoning model
  reasoning-premium:
    provider: openai
    model: gpt-4-turbo
    capabilities:
      - reasoning
      - tools
    cost_class: high
    speed: medium

budgets:
  trivial: 2000
  simple: 5000
  medium: 12000
  complex: 30000

permissions:
  read: allow
  search: allow
  write: ask
  shell: ask
  git:
    status: allow
    diff: allow
    commit: ask
    push: deny

# New privacy and security settings
privacy:
  deny:
    - ".env"
    - "*.pem"
    - ".ssh/**"
  local_only:
    - "internal/**"
  redact_secrets: true

# Optimization modes
optimization_modes:
  economy:
    prefer_local: true
    aggressive_rag: true
    small_context: true
    escalation_only_when_required: true
    
  balanced:
    optimize_quality_cost: true
    
  quality:
    premium_models_allowed_early: true
    independent_review: true
    more_verification: true
    
  local:
    never_send_project_context_externally: true