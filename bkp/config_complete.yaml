# Jev AI Orchestrator - Complete Advanced Configuration

jev:
  default_strategy: auto
  optimization:
    minimize_tokens: true
    prefer_local: true
    allow_escalation: true

  # Advanced adaptive routing settings
  adaptive_routing:
    enabled: true
    learning_rate: 0.1
    confidence_threshold: 0.7
    learning_window: 1000  # Last 1000 decisions

  # Context management settings
  context:
    fork_limit: 8000
    cache_ttl: 3600
    privacy_filtering: true
    value_scoring_enabled: true

  # Execution graph settings
  execution_graph:
    max_parallel_tasks: 4
    timeout_seconds: 300
    retry_attempts: 3

  # Resource scheduling
  resource_scheduler:
    enable_budgeting: true
    default_budget:
      tokens: 10000
      cost: 0.50
      time: 300

  # Security and privacy
  security:
    local_first_mode: true
    context_isolation: true
    secret_redaction: true

  # Optimization profiles
  optimization_profiles:
    economy:
      prefer_local: true
      aggressive_rag: true
      small_context: true
      escalation_only_when_required: true
      
    balanced:
      optimize_quality_cost: true
      moderate_timeout: true
      
    quality:
      premium_models_allowed_early: true
      independent_review: true
      more_verification: true
      
    local:
      never_send_project_context_externally: true
      local_only_execution: true

providers:
  # Default OpenAI provider
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}
    timeout: 30
    max_retries: 3

  # Default Anthropic provider
  anthropic:
    type: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    timeout: 30
    max_retries: 3

  # Example OpenAI-compatible provider (LM Studio)
  lmstudio:
    type: openai-compatible
    base_url: http://127.0.0.1:1234/v1
    timeout: 30
    max_retries: 3

  # Example CLI provider (Claude CLI)
  claude-cli:
    type: cli
    command: claude
    auto_detect: true
    timeout: 30
    max_retries: 3

models:
  # Local model fast responses
  local-fast:
    provider: lmstudio
    model: qwen
    capabilities:
      - chat
      - code
    cost_class: free
    speed: fast
    context_window: 8192

  # Premium coding model
  coding-premium:
    provider: anthropic
    model: claude-3-opus
    capabilities:
      - code
      - reasoning
      - tools
    cost_class: high
    speed: slow
    context_window: 200000

  # Reasoning model
  reasoning-premium:
    provider: openai
    model: gpt-4-turbo
    capabilities:
      - reasoning
      - tools
    cost_class: high
    speed: medium
    context_window: 128000

  # Local fast reasoning
  local-reasoning:
    provider: lmstudio
    model: llama2
    capabilities:
      - reasoning
    cost_class: free
    speed: fast
    context_window: 4096

budgets:
  trivial: 2000
  simple: 5000
  medium: 12000
  complex: 30000

permissions:
  read: allow
  search: allow
  write: ask
  shell: ask
  git:
    status: allow
    diff: allow
    commit: ask
    push: deny

# Advanced privacy and security settings
privacy:
  deny:
    - ".env"
    - "*.pem"
    - ".ssh/**"
    - "secrets/**"
    - "*.key"
    - "*.secret"
  local_only:
    - "internal/**"
    - "private/**"
  redact_secrets: true
  sensitive_patterns:
    - email
    - ip_address
    - mac_address
    - uuid
    - credit_card
    - ssn

# Tool management
tools:
  lazy_loading: true
  on_demand_discovery: true
  permission_scopes:
    filesystem:
      read: allow
      write: ask
      delete: deny
    network:
      http: allow
      dns: allow
      ssh: deny
    processes:
      spawn: ask
      kill: deny

# Resource management
resources:
  token_budget: 100000
  cost_budget: 10.00
  time_budget: 3600  # 1 hour

# Logging and monitoring
monitoring:
  enable_tracing: true
  enable_metrics: true
  log_level: info
  trace_sampling_rate: 0.1

# Task execution settings
execution:
  retry_policy:
    max_attempts: 3
    backoff_factor: 2
    exponential_backoff: true
  timeout:
    default: 300
    max: 1800
  validation:
    enabled: true
    strict: false
    auto_retry: true

# Backup and recovery
backup:
  enable_checkpointing: true
  checkpoint_interval: 300  # 5 minutes
  rollback_enabled: true
  backup_storage: local

# Performance optimization
performance:
  context_optimization:
    enabled: true
    value_scoring: true
    token_reduction: true
  model_selection:
    adaptive: true
    confidence_threshold: 0.7
  routing:
    dynamic: true
    feedback_based: true