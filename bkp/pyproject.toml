[tool.poetry]
name = "jev-orchestrator"
version = "0.1.0"
description = "Terminal-based AI development environment with intelligent orchestration"
authors = ["Jev AI Team <team@jev.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/jev-ai/jev-orchestrator"
repository = "https://github.com/jev-ai/jev-orchestrator"
keywords = ["ai", "orchestration", "terminal", "development", "llm"]

[tool.poetry.dependencies]
python = "^3.8"
openai = "^1.0.0"
anthropic = "^0.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
black = "^23.0.0"
flake8 = {version = "^6.0.0", python = ">=3.8.1"}
mypy = "^1.0.0"

[tool.poetry.scripts]
jev = "apps.cli.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/jev-ai/jev-orchestrator/issues"