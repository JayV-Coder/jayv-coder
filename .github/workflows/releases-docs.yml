# Publica no repositório público de releases a documentação do JayV e o
# changelog inteiro (ver `.github/scripts/manual.cjs`):
#   manual/index.json            a versão, as categorias e a ordem das páginas
#   manual/features/<id>.json    uma funcionalidade por arquivo
#   manual/commands.json         os comandos do chat, do teclado e do terminal
#   changelog.json               o que cada versão trouxe
#
# O site não lê esses arquivos direto: passa pela função `releases` do
# Supabase (`/manual` e `/changelog`).
#
# Roda ao fim de cada release (`release.yml` o chama depois do README) e
# também à mão, pela aba Actions. Usa o mesmo segredo do release:
#   RELEASES_TOKEN  token com `Contents: write` no jayv-coder-releases
name: Documentação dos releases

on:
  workflow_call:
    secrets:
      RELEASES_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releases-docs
  cancel-in-progress: false

env:
  RELEASES_OWNER: JayV-Coder
  RELEASES_REPO: jayv-coder-releases

jobs:
  docs:
    name: Publicar a documentação e o changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a documentação
        run: node .github/scripts/manual.cjs check

      - name: Enviar num commit só
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const { publication } = require("./.github/scripts/manual.cjs");
            const target = { owner: process.env.RELEASES_OWNER, repo: process.env.RELEASES_REPO };
            const files = publication();

            const { data: repo } = await github.rest.repos.get(target);
            const branch = repo.default_branch;
            const { data: ref } = await github.rest.git.getRef({ ...target, ref: `heads/${branch}` });
            const { data: head } = await github.rest.git.getCommit({ ...target, commit_sha: ref.object.sha });

            // A página de uma funcionalidade que saiu da documentação sai
            // também do repositório.
            const { data: current } = await github.rest.git.getTree({ ...target, tree_sha: head.tree.sha, recursive: "true" });
            const stale = current.tree
              .filter((entry) => entry.type === "blob" && entry.path.startsWith("manual/features/") && !(entry.path in files))
              .map((entry) => ({ path: entry.path, mode: "100644", type: "blob", sha: null }));

            const tree = [
              ...Object.entries(files).map(([path, content]) => ({ path, mode: "100644", type: "blob", content })),
              ...stale,
            ];
            const { data: next } = await github.rest.git.createTree({ ...target, base_tree: head.tree.sha, tree });

            // O `updatedAt` do índice muda a cada execução: só ele mudando
            // não vale um commit.
            const { data: compared } = await github.rest.git.getTree({ ...target, tree_sha: next.sha, recursive: "true" });
            const blobs = (list) => new Map(list.filter((entry) => entry.type === "blob" && entry.path !== "manual/index.json").map((entry) => [entry.path, entry.sha]));
            const before = blobs(current.tree);
            const after = blobs(compared.tree);
            const identical = before.size === after.size && [...after].every(([path, sha]) => before.get(path) === sha)
              && current.tree.some((entry) => entry.path === "manual/index.json");
            if (identical) {
              core.notice("A documentação e o changelog já estão publicados.");
              return;
            }

            const { version } = require("./src-tauri/tauri.conf.json");
            const { data: commit } = await github.rest.git.createCommit({
              ...target,
              message: `Documentação e changelog até v${version}`,
              tree: next.sha,
              parents: [head.sha],
            });
            await github.rest.git.updateRef({ ...target, ref: `heads/${branch}`, sha: commit.sha });
            core.notice(`Documentação e changelog publicados (v${version}, ${Object.keys(files).length} arquivos).`);
