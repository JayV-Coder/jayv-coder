# Gera os instaladores do JayV para Linux, Windows e macOS e os publica no
# release da versão em `src-tauri/tauri.conf.json` (tag `v<versão>`).
#
# O código é privado, então os releases moram no repositório público
# `JayV-Coder/jayv-coder-releases`: é de lá que o aplicativo instalado lê o
# `latest.json` para saber se há versão nova. Escrever em outro repositório pede
# dois segredos neste:
#   RELEASES_TOKEN             token com `Contents: write` no jayv-coder-releases
#   TAURI_SIGNING_PRIVATE_KEY  a chave que assina os pacotes de atualização
#
# Dispara a cada push no main, ao enviar uma tag `v*` ou manualmente pela aba
# Actions. Enquanto a versão não muda, cada build substitui os instaladores do
# mesmo release; para abrir um release novo — e oferecer a atualização a quem
# já instalou —, suba a versão.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".serena/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

env:
  RELEASES_OWNER: JayV-Coder
  RELEASES_REPO: jayv-coder-releases

jobs:
  prepare:
    name: Preparar release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      body: ${{ steps.release.outputs.body }}
    steps:
      # O histórico inteiro: as notas saem do `git log` entre dois releases.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Toda funcionalidade tem a sua página: sem ela, o release não sai.
      - name: Conferir a documentação
        run: node .github/scripts/manual.cjs check

      - name: Criar ou reaproveitar o release da versão
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const { version } = require("./src-tauri/tauri.conf.json");
            const tag = `v${version}`;
            // `github` fala com o repositório de releases; os commits deste
            // saem do checkout, sem precisar de um segundo token.
            const target = { owner: process.env.RELEASES_OWNER, repo: process.env.RELEASES_REPO };

            // Release precisa de uma tag, e tag precisa de um commit: o
            // repositório de releases vazio ganha um README antes do primeiro.
            try {
              await github.rest.repos.listCommits({ ...target, per_page: 1 });
            } catch (error) {
              if (error.status !== 409) throw error;
              await github.rest.repos.createOrUpdateFileContents({
                ...target,
                path: "README.md",
                message: "Instaladores do JayV",
                content: Buffer.from("# JayV\n\nInstaladores do JayV para Linux, Windows e macOS. Baixe a versão mais nova em [Releases](../../releases/latest).\n").toString("base64"),
              });
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { ...target, per_page: 100 });
            const found = releases.find((release) => release.tag_name === tag);

            // As notas são os commits desde o release publicado anterior. O
            // código não mora no repositório de releases, então cada release
            // guarda num comentário o commit de onde saiu, e é dele que a
            // comparação parte. Como o mesmo release recebe cada push até a
            // versão subir, o texto é refeito a cada build.
            const previous = releases
              .filter((release) => !release.draft && release.tag_name !== tag)
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at))[0];
            const base = previous?.body?.match(/<!-- source: ([0-9a-f]{40}) -->/)?.[1];
            const range = base ? `${base}..${context.sha}` : context.sha;
            const log = await exec.getExecOutput("git", ["log", "--no-merges", "--format=%s", range], { silent: true });
            const changes = log.stdout.split("\n").filter(Boolean).map((subject) => `- ${subject}`);
            const since = base ? `desde o ${previous.tag_name}` : "desde o início";
            const body = [
              `Instaladores do JayV ${tag} para Linux, Windows e macOS.`,
              "",
              `## O que mudou ${since}`,
              "",
              ...(changes.length ? changes : ["- Nenhuma mudança registrada."]),
              "",
              `<!-- source: ${context.sha} -->`,
              // As novidades desta versão para a janela "Novidades" do app
              // instalado, que as mostra antes de atualizar.
              require("./.github/scripts/whats-new.cjs").whatsNewComment(),
            ].join("\n");
            core.setOutput("body", body);

            if (found) {
              core.notice(`Atualizando os instaladores e as notas do release ${tag}.`);
              await github.rest.repos.updateRelease({ ...target, release_id: found.id, body });
              return found.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...target,
              tag_name: tag,
              name: `JayV ${tag}`,
              body,
              draft: true,
            });
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Dependências do front-end
        run: npm ci

      - name: Build e envio dos instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          owner: ${{ env.RELEASES_OWNER }}
          repo: ${{ env.RELEASES_REPO }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # As notas do `latest.json` são o corpo do release, com as novidades
          # desta versão que o app lê antes de atualizar.
          releaseBody: ${{ needs.prepare.outputs.body }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

  publish:
    name: Publicar release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Tirar o release do rascunho
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({ owner: process.env.RELEASES_OWNER, repo: process.env.RELEASES_REPO, release_id: Number(process.env.RELEASE_ID), draft: false });

  # O README do repositório de releases lista os instaladores de cada versão
  # por sistema; é refeito depois de cada release publicado.
  readme:
    name: README dos releases
    needs: publish
    uses: ./.github/workflows/releases-readme.yml
    secrets:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

  # A documentação (uma funcionalidade por JSON) e o changelog inteiro, que o
  # site lê pela função `releases` do Supabase. Depois do README, para os dois
  # não disputarem o mesmo ramo.
  docs:
    name: Documentação dos releases
    needs: readme
    uses: ./.github/workflows/releases-docs.yml
    secrets:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
