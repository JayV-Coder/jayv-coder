# Gera os instaladores do JayV para Linux, Windows e macOS e os publica no
# release da versão em `src-tauri/tauri.conf.json` (tag `v<versão>`).
#
# Dispara a cada push no main, ao enviar uma tag `v*` ou manualmente pela aba
# Actions. Enquanto a versão não muda, cada build substitui os instaladores do
# mesmo release; para abrir um release novo, suba a versão.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", ".serena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  prepare:
    name: Preparar release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Criar ou reaproveitar o release da versão
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require("./src-tauri/tauri.conf.json");
            const tag = `v${version}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const found = releases.find((release) => release.tag_name === tag);
            if (found) {
              core.notice(`Atualizando os instaladores do release ${tag}.`);
              return found.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `JayV ${tag}`,
              body: `Instaladores do JayV ${tag} para Linux, Windows e macOS.`,
              draft: true,
            });
            return data.id;

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust estável
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.args }}

      - name: Dependências do front-end
        run: npm ci

      - name: Build e envio dos instaladores
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

  publish:
    name: Publicar release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Tirar o release do rascunho
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({ ...context.repo, release_id: Number(process.env.RELEASE_ID), draft: false });
