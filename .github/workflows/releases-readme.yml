# Reescreve o README.md do repositório público de releases com os instaladores
# de cada versão, separados por sistema (ver `.github/scripts/releases-readme.cjs`).
#
# Roda ao fim de cada release (`release.yml` o chama depois de publicar) e
# também à mão, pela aba Actions. Usa o mesmo segredo do release:
#   RELEASES_TOKEN  token com `Contents: write` no jayv-coder-releases
name: README dos releases

on:
  workflow_call:
    secrets:
      RELEASES_TOKEN:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: releases-readme
  cancel-in-progress: false

env:
  RELEASES_OWNER: JayV-Coder
  RELEASES_REPO: jayv-coder-releases

jobs:
  readme:
    name: Atualizar o README dos releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Gerar e enviar o README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASES_TOKEN }}
          script: |
            const { render } = require("./.github/scripts/releases-readme.cjs");
            const target = { owner: process.env.RELEASES_OWNER, repo: process.env.RELEASES_REPO };
            const releases = await github.paginate(github.rest.repos.listReleases, { ...target, per_page: 100 });
            const readme = render(releases);

            let sha;
            try {
              const { data } = await github.rest.repos.getContent({ ...target, path: "README.md" });
              sha = data.sha;
              if (Buffer.from(data.content, "base64").toString("utf8") === readme) {
                core.notice("O README dos releases já está atualizado.");
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const latest = releases.find((release) => !release.draft)?.tag_name ?? "sem release";
            await github.rest.repos.createOrUpdateFileContents({
              ...target,
              path: "README.md",
              message: `README: instaladores até ${latest}`,
              content: Buffer.from(readme).toString("base64"),
              sha,
            });
            core.notice(`README dos releases atualizado (${latest}).`);
