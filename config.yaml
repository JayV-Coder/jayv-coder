jev:
  default_strategy: auto
  optimization:
    minimize_tokens: true
    prefer_local: true
    allow_escalation: true
  adaptive_routing:
    enabled: true
    confidence_threshold: 0.7
  context:
    fork_limit: 8000
    cache_ttl: 3600
    privacy_filtering: true

# Provedores e modelos nao moram aqui: ficam no banco local e sao editados
# pela tela Configuracao do LLM (Claude Code, Codex e Copilot).

budgets:
  trivial: 2000
  simple: 5000
  medium: 12000
  complex: 30000

permissions:
  read: allow
  search: allow
  write: ask
  shell: ask

privacy:
  deny: [".env", "*.pem", ".ssh/**", "secrets/**", "*.key", "*.secret"]
  local_only: ["internal/**", "private/**"]
  redact_secrets: true
